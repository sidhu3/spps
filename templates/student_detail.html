{% extends 'home.html'%}
{% block title %}student form{% endblock %}
{% block bodyblock %}    
<style>
  /* Background Gradient */
  body {
    background: linear-gradient(#51baf7,#0362ab, #013054);
    min-height: 100vh;
  }

  /* Centering the Form */
  .form-wrapper {
    min-height: 100vh; /* Full viewport height */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Form Container Styling */
  .form-container {
    background: #ffffff; /* White background */
    /* border: 2px solid black; */
    border-radius: 15px; /* Rounded corners */
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
    padding: 30px; /* Padding */
    max-width: 500px; /* Width of the form */
    width: 100%; /* Responsive */
  }

  .form-container h4 {
    font-family: 'Poppins', sans-serif; /* Stylish font */
    font-weight: 600;
    color: #0277bd; /* Stylish blue for heading */
    margin-bottom: 20px;
  }

  .form-container .btn-primary {
    background-color: #0168a4; /* Primary button color */
    border: none;
    transition: all 0.3s ease-in-out;
  }

  .form-container .btn-primary:hover {
    background-color: #01579b; /* Darker shade on hover */
    transform: scale(1.05); /* Slight zoom effect */
  }

  .form-container .form-control {
    border-radius: 10px; /* Rounded input fields */
  }

  /* Add Margin for Small Screens */
  @media (max-width: 576px) {
    .form-container {
      margin: 0 10px; /* Adds 10px margin on left and right */
    }
  }

</style>

<div class="form-wrapper">
  <div class="form-container">
    <h4 class="text-center">Student Performance Prediction</h4>
    <form action="/predict" method="POST">
      <div class="mb-3">
        <label for="student_name" class="form-label">Student Name:</label>
        <input type="text" id="student_name" name="student_name" class="form-control" placeholder="Enter student name" required>
      </div>
      <div class="mb-3">
        <label for="roll_no" class="form-label">Roll Number:</label>
        <input type="text" id="roll_no" name="roll_no" class="form-control" placeholder="Enter roll number" required>
      </div>
      <div class="mb-3">
        <label for="hours_studied" class="form-label">Hours Studied /Day:</label>
        <input type="number" id="hours_studied" name="hours_studied" class="form-control" min="0" max="8" step="0.1" placeholder="Max 8 hours/day" required>
      </div>
      <div class="mb-3">
        <label for="attendance_percentage" class="form-label">Attendance Percentage:</label>
        <input type="number" id="attendance_percentage" name="attendance_percentage" class="form-control" min="50" max="100" step="1" placeholder="Above 50%" required>
      </div>
      <div class="mb-3">
        <label for="assignments_submitted" class="form-label">Assignments Submitted:</label>
        <input type="number" id="assignments_submitted" name="assignments_submitted" class="form-control" min="0" max="8" placeholder="Total 8 subjects" required>
      </div>
      <div class="mb-3">
        <label for="previous_grades" class="form-label">Previous Grades:</label>
        <input type="number" id="previous_grades" name="previous_grades" class="form-control" min="0" max="100" step="0.1" required>
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-primary">Predict</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
