<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1d3557, #457b9d);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .card-title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: bold;
            color: #1d3557;
        }

        .btn-primary {
            background-color: #1d3557;
            border: none;
            transition: all 0.3s ease-in-out;
        }

        .btn-primary:hover {
            background-color: #457b9d;
            transform: scale(1.05);
        }

        a {
            color: #1d3557;
        }

        a:hover {
            color: #457b9d;
            text-decoration: underline;
        }

        .alert {
            border-radius: 5px;
        }

        #passwordStrength {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card mx-auto" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title">Reset Password</h5>
                <form method="POST" action="{{ url_for('reset_password', token=token) }}">
                    <div class="form-group">
                        <label for="password">Enter New Password:</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter new password" autocomplete="off" required>
                        <small id="passwordStrength" class="form-text"></small>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block mt-3">Reset Password</button>
                </form>
                <p class="mt-3 text-center">
                    <a href="{{ url_for('login') }}">Back to Login</a>
                </p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                <div class="mt-3" aria-live="polite">
                    {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
                {% endif %}
                {% endwith %}
            </div>
        </div>
    </div>
    <script>
        const passwordInput = document.getElementById('password');
        const passwordStrength = document.getElementById('passwordStrength');

        passwordInput.addEventListener('input', () => {
            const value = passwordInput.value;
            if (value.length < 6) {
                passwordStrength.textContent = 'Weak';
                passwordStrength.style.color = 'red';
            } else if (value.length < 10) {
                passwordStrength.textContent = 'Moderate';
                passwordStrength.style.color = 'orange';
            } else {
                passwordStrength.textContent = 'Strong';
                passwordStrength.style.color = 'green';
            }
        });
    </script>
</body>
</html>
