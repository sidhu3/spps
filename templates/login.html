{% extends 'home.html' %}

{% block title %}login{% endblock %}

{% block bodyblock %}
<style>
  /* Background Gradient */
  body {
    background: linear-gradient(135deg,#339cf7, #26d0e7, #e3f2fd);
    min-height: 100vh;
  }

  /* Centering Only the Login Form */
  .login-wrapper {
    min-height: 100vh; /* Full viewport height */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Login Form Styling */
  .login-container {
    background: #ffffff; /* White background for the form */
    border-radius: 15px; /* Rounded corners */
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
    padding: 30px; /* Padding inside the form */
    max-width: 400px; /* Width of the form */
    width: 100%; /* Responsive */
  }

  .login-container h3 {
    font-family: 'Poppins', sans-serif; /* Modern font */
    font-weight: 600;
    color: #0277bd; /* Stylish blue color for heading */
    margin-bottom: 20px;
  }

  .login-container .btn-primary {
    background-color: #0277bd; /* Primary button color */
    border: none;
    transition: all 0.3s ease-in-out;
  }

  .login-container .btn-primary:hover {
    background-color: #01579b; /* Darker shade on hover */
    transform: scale(1.05); /* Slight zoom effect */
  }

  .login-container .form-control {
    border-radius: 10px; /* Rounded input fields */
  }

  .login-container .forgot-password {
    font-size: 0.9rem;
    color: #555;
    margin-top: 15px;
  }

  .login-container .forgot-password a {
    color: #0277bd;
    text-decoration: none;
  }

  .login-container .forgot-password a:hover {
    text-decoration: underline;
  }

.login-container {
  animation: fadeIn 0.5s ease-in-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
  
</style>

<div class="login-wrapper">
  <div class="login-container">
    <h3 class="text-center">Login</h3>
    <form id="login-form" action="" method="POST">
      <!-- Username Field -->
      <div class="mb-3">
        <label for="uname" class="form-label">Username</label>
        <input type="text" class="form-control" id="uname" name="uname" required>
      </div>
      <!-- Password Field -->
      <div class="mb-3">
        <label for="upassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="upassword" name="upassword" required autocomplete="off">
      </div>
      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary w-100">Login</button>
      <div class="forgot-password text-center">
        <p>Forgot Password? <a href="/forgot-password">Click here to reset password</a></p>
      </div>
    </form>
  </div>
</div>

{% endblock %}
