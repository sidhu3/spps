{% extends 'home.html' %}
{% block title %}signup{% endblock %}
{% block bodyblock %}
<style>
  /* Background Gradient */
  body {
    background: linear-gradient(135deg,#339cf7, #26d0e7, #e3f2fd);
    min-height: 100vh;
  }

  /* Centering Only the Signup Form */
  .signup-wrapper {
    min-height: 100vh; /* Full viewport height */
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Signup Form Styling */
  .signup-container {
    background: #ffffff; /* White background for the form */
    border-radius: 15px; /* Rounded corners */
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
    padding: 30px; /* Padding inside the form */
    max-width: 450px; /* Width of the form */
    width: 100%; /* Responsive */
  }

  .signup-container h3 {
    font-family: 'Poppins', sans-serif; /* Modern font */
    font-weight: 600;
    color: #0277bd; /* Stylish blue color for heading */
    margin-bottom: 20px;
  }

  .signup-container .btn-primary {
    background-color: #0277bd; /* Primary button color */
    border: none;
    transition: all 0.3s ease-in-out;
  }

  .signup-container .btn-primary:hover {
    background-color: #01579b; /* Darker shade on hover */
    transform: scale(1.05); /* Slight zoom effect */
  }

  .signup-container .form-control {
    border-radius: 10px; /* Rounded input fields */
  }

  .signup-container .already-account {
    font-size: 0.9rem;
    color: #555;
    margin-top: 15px;
  }

  .signup-container .already-account a {
    color: #0277bd;
    text-decoration: none;
  }

  .signup-container .already-account a:hover {
    text-decoration: underline;
  }

.signup-container {
  animation: fadeIn 0.5s ease-in-out;
}

/* Add Margin for Small Screens */
  @media (max-width: 576px) {
    .signup-container {
      margin: 0 10px; /* Adds 10px margin on left and right */
    }
  }

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}  
</style>

<div class="signup-wrapper">
  <div class="signup-container">
    <h3 class="text-center">Signup Form</h3>
    <form id="signup-form" action="" method="POST">
      <div class="mb-3">
        <label for="uname" class="form-label">Username</label>
        <input type="text" class="form-control" id="uname" name="uname" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email ID</label>
        <input type="email" class="form-control" id="email" name="email" required>
      </div>
      <div class="mb-3">
        <label for="fname" class="form-label">Firstname</label>
        <input type="text" class="form-control" id="fname" name="fname" required>
      </div>
      <div class="mb-3">
        <label for="lname" class="form-label">Lastname</label>
        <input type="text" class="form-control" id="lname" name="lname" required>
      </div>
      <div class="mb-3">
        <label for="upassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="upassword" name="upassword" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign-Up</button>
      <div class="already-account text-center">
        <p>Already have an account? <a href="/login">Click here to login</a></p>
      </div>
    </form>
  </div>
</div>

{% endblock %}
